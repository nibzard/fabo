[project]
name = "fabo"
version = "0.1.0"
description = "Fabulous screen-shooter of your social media milestones"
readme = "README.md"
authors = [
    { name = "nkkko", email = "nkkko@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # Steel.dev SDK
    "steel-sdk>=0.13.0",

    # API Framework
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",

    # CLI Framework
    "typer>=0.12.0",
    "rich>=13.7.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Database
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Logging
    "structlog>=24.2.0",

    # Dependency Injection
    "dependency-injector>=4.41.0",

    # Utilities
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
fabo = "fabo.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src/fabo --cov-report=term-missing --cov-report=html"
